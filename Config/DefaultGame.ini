; ---- GameplayCue ----
; 这里**故意不配** GlobalGameplayCueManagerClass。
;
; 原因（实测结论，别再踩一遍）：UAbilitySystemGlobals::GetGameplayCueManager() 在启动很早的阶段
; 就会 LoadClass 这个配置项，而那一刻本项目自己的 GameplayCueManager 子类还没法解析，
; 引擎会**静默**回退到默认的 UGameplayCueManager（不报错、不告警）。实测日志里管理器名是
; `GameplayCueManager_0` 而不是自定义类的名字，而后果是"所有 GameplayCue 特效消失"且毫无线索。
;
; 因此本项目的原生 cue 注册走代码路径，不依赖任何自定义管理器：
;   RogueGameplayCues::EnsureNativeImpactCuesRegistered()
; 由 ARoguePlayerState::BeginPlay（每台机器都会跑、且早于任何特效触发）与
; ARogueGameState::PlayImpactEffect（权威端兜底）调用，幂等。
; 实现见 AbilitySystem/Cues/RogueGameplayCue_Impact.h/.cpp（与那个 C++ cue 通知放一起）。
;
; 注：项目里**没有**保留自定义 GameplayCueManager 子类 —— 它从来没有被实例化过
; （上面这条配置既然不能用，它就永远走不到），保留一个死类只会让"cue 到底怎么注册的"更难查。
